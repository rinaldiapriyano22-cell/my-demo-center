
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - My Demo Center</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f6fb;
      font-family: Arial, sans-serif;
      color: #142b4c;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 36px;
      border-radius: 22px;
      box-shadow: 0 15px 45px rgba(20,43,76,.08);
    }
    h2 { margin-top: 0; }
    p { color: #718096; line-height: 1.5; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 15px;
    }
    input { border: 1px solid #d6dfec; }
    button {
      border: 0;
      background: #142b4c;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { font-size: 14px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>MY DEMO CENTER</h2>
    <p>Buat password baru untuk akun Super Admin kamu.</p>

    <form id="resetForm">
      <input
        type="password"
        id="password"
        placeholder="Password baru (minimal 8 karakter)"
        minlength="8"
        required
      >
      <input
        type="password"
        id="confirmPassword"
        placeholder="Ulangi password baru"
        minlength="8"
        required
      >
      <button id="submitBtn" type="submit">SIMPAN PASSWORD BARU</button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://vixuldydntdjkcibryst.supabase.co";

    // Ganti dengan Publishable Key yang sama seperti di index.html
    const SUPABASE_KEY = "sb_publishable_F5NS97tsE32a1yiiQ4Hsow_49c0aLgL";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const message = document.getElementById("message");
    const form = document.getElementById("resetForm");
    const button = document.getElementById("submitBtn");

    async function checkSession() {
      const { data, error } = await supabase.auth.getSession();

      if (error || !data.session) {
        form.style.display = "none";
        message.textContent =
          "Sesi pemulihan tidak ditemukan atau tautan sudah kedaluwarsa. Minta email pemulihan baru.";
        message.style.color = "#c0392b";
      }
    }

    checkSession();

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent = "Password minimal 8 karakter.";
        message.style.color = "#c0392b";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Konfirmasi password tidak cocok.";
        message.style.color = "#c0392b";
        return;
      }

      button.disabled = true;
      button.textContent = "MENYIMPAN...";
      message.textContent = "";

      const { error } = await supabase.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent = "Gagal: " + error.message;
        message.style.color = "#c0392b";
        button.disabled = false;
        button.textContent = "SIMPAN PASSWORD BARU";
        return;
      }

      message.textContent =
        "Password berhasil diperbarui. Silakan login kembali.";
      message.style.color = "#16803c";

      await supabase.auth.signOut();

      setTimeout(() => {
        window.location.href = "/";
      }, 2500);
    });
  </script>
</body>
</html>
